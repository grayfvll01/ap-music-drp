# Apple Music Discord Presence: advanced settings.
# The everyday options are in the tray menu (click the music note); this file has everything.
# Changes apply as soon as you save.
# Only the Apple Music and Spotify apps are ever read. No other app can show up on your status.
# Delete this file to reset everything to defaults.

# Discord application ID. Its name is what Discord shows as "Listening to <name>".
# The default is this project's "Apple Music" app. To use your own, create one at
# https://discord.com/developers/applications and paste its Application ID here.
client_id = 1554292539270500395

# Which music apps to show. If both are playing, the one already on your status stays.
apple_music = true
spotify = true

# Name shown after "Listening to" (overrides the app's name), for Apple Music and Spotify.
# Empty = use the Discord app's name.
name = Apple Music
spotify_name = Spotify

# listening | playing | watching
activity_type = listening

# What the member list shows next to your name:
#   name    -> "Listening to Apple Music" (or "Listening to Spotify")
#   details -> "Listening to <details line>" (the song title by default)
#   state   -> "Listening to <state line>"   (the artist by default)
#   song_artist -> "Listening to <song> — <artist>" (the album goes on the second line)
status_display = details

# Presence lines. Placeholders: {title} {artist} {album}
# Leave a line empty to hide it (but keep details or state, or nothing is shown).
details = {title}
state = {artist}
large_text = {album}

# Show the elapsed / total time bar.
show_progress = true

# Keep the presence while paused (without the time bar). Off = clear on pause.
show_paused = false

# Album art and Apple Music links come from the public iTunes Search API
# (only the song's title, artist, album and store are sent). No lookups at all happen
# when artwork, links and both buttons are off. Spotify's links need no lookup.
artwork = true
artwork_size = 512
# Make the title / artist / album clickable: Apple Music links, or Spotify search links
# when the song plays in Spotify.
links = true
# Store country for lookups: auto (from your Windows region) or a 2-letter code like us, gb, de.
# Links on your status never include the country.
country = auto

# Image shown when no album art is found (https URL, or empty for none).
fallback_image = https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/ce/e5/e7/cee5e74c-d943-b7fc-02ac-70220d7dd16d/musicCalistoga-0-0-1x_U007epad-0-1-0-85-220.png/512x512bb.jpg
spotify_fallback_image = https://is1-ssl.mzstatic.com/image/thumb/Purple211/v4/fd/b0/e6/fdb0e66d-165c-aa66-ac6b-1ee1e01911e8/AppIcon-0-0-1x_U007epad-0-1-0-0-sRGB-85-220.png/512x512bb.jpg

# Buttons under the presence (only other people can see and click them).
# "Listen on Apple Music" (or "Listen on Spotify")
button_listen = false
# "song.link" (opens the song on any streaming service)
button_songlink = false

# How often to check the music apps, in milliseconds (250 - 10000).
poll_ms = 1000

# Check GitHub for new versions (at start and twice a day) and offer them in the tray menu.
update_check = true

# Write a debug log to log.txt next to this file.
log = false
