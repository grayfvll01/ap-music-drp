[package]
name = "apple-music-discord-presence"
version = "1.0.5"
edition = "2024"
rust-version = "1.88"
description = "Show what you're playing in Apple Music on your Discord profile (Windows tray app)"
license = "MIT"
repository = "https://github.com/grayfvll01/apple-music-discord-presence"
readme = "README.md"
keywords = ["discord", "rich-presence", "apple-music", "windows"]

[lib]
doctest = false

# Unit tests live in the library (they need `std`); the exe itself has none.
[[bin]]
name = "AppleMusicDiscordPresence"
path = "src/main.rs"
test = false

[dependencies.windows]
version = "0.62"
default-features = false
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

# The exe has no std, so it can't unwind; tests (which use std) ignore this.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
