name: build

# Releases: scripts/release.ps1 1.2.3 pushes the tag v1.2.3, and this workflow
# publishes it with that version's CHANGELOG.md section as the notes.
# Installed copies of the app find it and offer to update.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup update stable && rustup default stable

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            if ($env:GITHUB_REF_NAME -ne "v$v") { throw "Tag $env:GITHUB_REF_NAME doesn't match Cargo.toml version $v" }
            $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($v))(?: [^\n]*)?\n(.*?)(?=^## |\z)")
            if (-not $m.Success -or -not $m.Groups[1].Value.Trim()) { throw "CHANGELOG.md has no section for $v" }
            $m.Groups[1].Value.Trim() | Set-Content -Encoding utf8 release-notes.md
          }

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=${{ steps.version.outputs.version }}" installer\setup.iss
          if ($LASTEXITCODE) { throw "ISCC failed" }

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/AppleMusicDiscordPresence.exe, target/installer/AppleMusicDiscordPresence-Setup.exe dist/
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Set-Content -NoNewline "$($_.FullName).sha256"
            "$($_.Name): $($_.Length) bytes, SHA-256 $h" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }

      - uses: actions/upload-artifact@v4
        with:
          name: apple-music-discord-presence
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $install = "**Download** ``AppleMusicDiscordPresence-Setup.exe`` and run it, or use the portable ``AppleMusicDiscordPresence.exe``. Installed copies update themselves."
          $notes = (Get-Content release-notes.md -Raw).Trim() + "`n`n" + $install
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*) --title "$env:GITHUB_REF_NAME" --notes $notes
